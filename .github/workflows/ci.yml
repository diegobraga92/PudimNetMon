name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-build:
    name: Build Agent (C++)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake protobuf-compiler libprotobuf-dev \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc build-essential
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build -j$(nproc)

  collector-build:
    name: Build Collector (C++)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake protobuf-compiler libprotobuf-dev \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc build-essential
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build -j$(nproc)

  dashboard-lint-build:
    name: Lint & Build Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (TypeScript check)
        run: npm run lint
      - name: Build
        run: npm run build