name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-agent:
    name: C++ Agent (build)
    # Check latest: https://github.com/actions/runner-images/releases
    runs-on: ubuntu-26.04
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev libpcap-dev libsystemd-dev libsqlite3-dev

      - name: Configure
        run: cmake -S agent -B build/agent -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/agent -j$(nproc)

      - name: Test (CTest)
        working-directory: build/agent
        run: ctest --output-on-failure

  cpp-collector:
    name: C++ Collector (build)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev

      - name: Configure
        run: cmake -S collector -B build/collector -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/collector -j$(nproc)

      - name: Test (CTest)
        working-directory: build/collector
        run: ctest --output-on-failure

  cpp-agent-windows:
    name: C++ Agent (Windows build)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      # Keep the vcpkg-tool release used below in sync with the cache key so a
      # tool upgrade never restores a stale installed tree / binary cache.
      VCPKG_TOOL_VERSION: "2026-07-27"
      # vcpkg removed its GitHub Actions binary-cache provider (x-gha); parsing
      # `x-gha` now only emits a deprecation warning and registers NO provider,
      # so the previous `clear;x-gha,readwrite` silently disabled binary caching
      # and forced a from-source rebuild of grpc/protobuf/openssl/curl on every
      # run. Use a files-based binary cache inside the workspace instead and let
      # actions/cache persist it between runs.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Checkout vcpkg (pinned baseline)
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout e90cc0982b7cfae62447f1f3bed1fbca0bc8f6be

      # Check latest: https://github.com/microsoft/vcpkg-tool/releases
      - name: Fetch vcpkg tool (with retries)
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            -o "$env:VCPKG_ROOT\vcpkg.exe" `
            "https://github.com/microsoft/vcpkg-tool/releases/download/$env:VCPKG_TOOL_VERSION/vcpkg.exe"
          & "$env:VCPKG_ROOT\vcpkg.exe" version --disable-metrics

      # Check latest: https://github.com/actions/cache/releases
      # Two cache layers make the Configure step fast: the installed tree
      # (build/agent-win/vcpkg_installed) and the files-based binary cache
      # (.vcpkg-cache). `downloads` avoids re-downloading source tarballs.
      # buildtrees/packages are intentionally NOT cached: buildtrees alone can
      # push the repo past the 10 GB Actions-cache budget (silently evicting
      # every entry, so every run is a cold build) and stale intermediate build
      # state can corrupt later builds; `packages` is only a staging dir in
      # manifest mode. save-always keeps the caches warm even when a later step
      # (e.g. the build) fails.
      - name: Cache vcpkg artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ github.workspace }}/.vcpkg-cache
            build/agent-win/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('agent/vcpkg.json') }}-${{ env.VCPKG_TOOL_VERSION }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
          save-always: true

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          cmake -S agent -B build/agent-win `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release

      - name: Build
        shell: pwsh
        # Bounded parallelism: MSBuild's /m (bare -j) spawns unbounded cl.exe
        # processes which can exhaust memory while linking gRPC and interleaves
        # output so real linker errors get lost in the log.
        run: cmake --build build/agent-win --config Release -j 2

      - name: Test (CTest)
        shell: pwsh
        working-directory: build/agent-win
        run: ctest -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Stage installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item build/agent-win/Release/pudim-agent.exe installer/payload/
          # The MSVC build links the dynamic CRT, so bundle the VC++ runtime for
          # machines that do not have the redistributable installed.
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            -o installer/payload/vc_redist.x64.exe `
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Keep the installer version in sync with the CMake project version.
          $match = Select-String -Path agent/CMakeLists.txt `
            -Pattern 'project\(pudim-agent VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          $version = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.1.0' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$version" installer/installer-agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Built PudimNetMon-Agent-Setup-$version.exe"

      - name: Smoke test installer (silent install -> service -> uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/PudimNetMon-Agent-Setup-*.exe |
            Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced' }

          $p = Start-Process -FilePath $setup.FullName -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed (exit $($p.ExitCode))" }

          Start-Sleep -Seconds 3
          $svc = Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue
          if (-not $svc) { throw 'PudimNetMonAgent service not registered' }
          if ($svc.Status -notin 'Running', 'StartPending') {
            throw "Service not running after install (status: $($svc.Status))"
          }
          Write-Host "Service OK ($($svc.Status))"

          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'PudimNetMon Agent' } |
            Select-Object -First 1
          if (-not $entry) { throw 'Uninstaller not registered in Add/Remove Programs' }
          if ($entry.UninstallString -match '^"([^"]+)"') {
            $uninstExe = $Matches[1]
          } else {
            $uninstExe = $entry.UninstallString
          }

          $p = Start-Process -FilePath $uninstExe -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed (exit $($p.ExitCode))" }

          Start-Sleep -Seconds 3
          if (Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue) {
            throw 'Service still registered after uninstall'
          }
          Write-Host 'Uninstall OK: service removed'

      # Check latest: https://github.com/actions/upload-artifact/releases
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pudimnetmon-agent-windows-setup
          path: dist/installer/*
          if-no-files-found: error

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      # Check latest: https://github.com/actions/setup-node/releases
      # Check latest: https://nodejs.org/en/about/previous-releases
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build