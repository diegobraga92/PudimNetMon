name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-agent:
    name: C++ Agent (build)
    # Check latest: https://github.com/actions/runner-images/releases
    runs-on: ubuntu-26.04
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev libpcap-dev libsystemd-dev libsqlite3-dev

      - name: Configure
        run: cmake -S agent -B build/agent -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/agent -j$(nproc)

      - name: Test (CTest)
        working-directory: build/agent
        run: ctest --output-on-failure

  cpp-collector:
    name: C++ Collector (build)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev

      - name: Configure
        run: cmake -S collector -B build/collector -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/collector -j$(nproc)

      - name: Test (CTest)
        working-directory: build/collector
        run: ctest --output-on-failure

  cpp-agent-windows:
    name: C++ Agent (Windows build)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      # Static vcpkg libraries (x64-windows-static-md) so pudim-agent.exe is
      # self-contained: the installer payload is a single exe and the service
      # runs from "Program Files", where the vcpkg DLLs (grpc/protobuf/openssl/
      # curl/sqlite3) would not be present. The MSVC build still links the
      # dynamic CRT, which the bundled vc_redist.x64.exe installs. "-release"
      # keeps the vcpkg ports to Release-only builds so the cache stays small.
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md-release
      # Keep the vcpkg-tool release used below in sync with the cache key so a
      # tool upgrade never restores a stale installed tree / binary cache.
      VCPKG_TOOL_VERSION: "2026-07-27"
      # vcpkg removed its GitHub Actions binary-cache provider (x-gha); parsing
      # `x-gha` now only emits a deprecation warning and registers NO provider,
      # so the previous `clear;x-gha,readwrite` silently disabled binary caching
      # and forced a from-source rebuild of grpc/protobuf/openssl/curl on every
      # run. Use a files-based binary cache inside the workspace instead and let
      # actions/cache persist it between runs.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Checkout vcpkg (pinned baseline)
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout e90cc0982b7cfae62447f1f3bed1fbca0bc8f6be

      # Check latest: https://github.com/microsoft/vcpkg-tool/releases
      - name: Fetch vcpkg tool (with retries)
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            -o "$env:VCPKG_ROOT\vcpkg.exe" `
            "https://github.com/microsoft/vcpkg-tool/releases/download/$env:VCPKG_TOOL_VERSION/vcpkg.exe"
          & "$env:VCPKG_ROOT\vcpkg.exe" version --disable-metrics

      # Check latest: https://github.com/actions/cache/releases
      # Two cache layers make the Configure step fast: the installed tree
      # (build/agent-win/vcpkg_installed) and the files-based binary cache
      # (.vcpkg-cache). `downloads` avoids re-downloading source tarballs.
      # buildtrees/packages are intentionally NOT cached: buildtrees alone can
      # push the repo past the 10 GB Actions-cache budget (silently evicting
      # every entry, so every run is a cold build) and stale intermediate build
      # state can corrupt later builds; `packages` is only a staging dir in
      # manifest mode. save-always keeps the caches warm even when a later step
      # (e.g. the build) fails.
      - name: Cache vcpkg artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ github.workspace }}/.vcpkg-cache
            build/agent-win/vcpkg_installed
          # "v2" in the key deliberately breaks prefix-matching against stale
          # pre-v2 entries (restore-keys would otherwise resurrect a cache that
          # contains downloads but an empty .vcpkg-cache, forcing a full 3h
          # rebuild every run). Bump the marker whenever the cache layout, the
          # vcpkg baseline, or the linkage/triplet changes -- "v3" here
          # invalidates the dynamic-linkage caches from the x64-windows-release
          # era after switching to static vcpkg libraries.
          key: vcpkg-v3-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('agent/vcpkg.json') }}-${{ env.VCPKG_TOOL_VERSION }}
          restore-keys: |
            vcpkg-v3-${{ runner.os }}-
          save-always: true

      # Makes cache behaviour visible in the log: if actions/cache restored a
      # stale/empty entry, this shows it before vcpkg runs.
      - name: Inspect restored vcpkg cache
        shell: pwsh
        run: |
          function Show-CacheDir($name, $dir) {
            if (Test-Path $dir) {
              $files = Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue
              $sizeMB = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
              Write-Host "$name restored: $($files.Count) file(s), $sizeMB MB ($dir)"
            } else {
              Write-Host "$name restored: MISSING ($dir)"
            }
          }
          Show-CacheDir 'vcpkg downloads'   "$env:VCPKG_ROOT/downloads"
          Show-CacheDir 'binary cache'      "${{ github.workspace }}/.vcpkg-cache"
          Show-CacheDir 'installed tree'    "build/agent-win/vcpkg_installed"

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          cmake -S agent -B build/agent-win `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release

      - name: Build
        shell: pwsh
        # Bounded parallelism: MSBuild's /m (bare -j) spawns unbounded cl.exe
        # processes which can exhaust memory while linking gRPC and interleaves
        # output so real linker errors get lost in the log.
        run: cmake --build build/agent-win --config Release -j 2

      - name: Test (CTest)
        shell: pwsh
        working-directory: build/agent-win
        run: ctest -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Stage installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item build/agent-win/Release/pudim-agent.exe installer/payload/
          # The MSVC build links the dynamic CRT, so bundle the VC++ runtime for
          # machines that do not have the redistributable installed.
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-connrefused `
            -o installer/payload/vc_redist.x64.exe `
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Keep the installer version in sync with the CMake project version.
          $match = Select-String -Path agent/CMakeLists.txt `
            -Pattern 'project\(pudim-agent VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          $version = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.1.0' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$version" installer/installer-agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Built PudimNetMon-Agent-Setup-$version.exe"

      - name: Smoke test installer (install -> config model -> upgrade -> uninstall)
        shell: pwsh
        run: |
          # Every setup/uninstaller launch below is bounded: a wedged child of
          # the installer (e.g. the bundled VC++ redistributable / msiexec, or a
          # [Run] step) used to stall this step for hours with zero output.
          function Invoke-SetupProcess {
            param(
              [string]$Phase,
              [string]$FilePath,
              [string[]]$ArgumentList,
              [string]$LogFile,
              [int]$TimeoutSeconds = 900
            )
            Write-Host "[$Phase] starting: $FilePath $($ArgumentList -join ' ')"
            $p = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $p.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Host "[$Phase] TIMEOUT after ${TimeoutSeconds}s; killing process tree"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              # Kill leftover installer/agent children so the step fails cleanly
              # instead of leaving orphaned processes behind.
              Get-Process -Name 'pudim-agent', 'unins000', 'Setup*', 'Pudim*' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  killing leftover $($_.ProcessName) pid=$($_.Id)"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
              Write-Host '---- service state ----'
              sc.exe query PudimNetMonAgent 2>&1 | Out-String | Write-Host
              Write-Host '---- agent processes ----'
              Get-Process pudim-agent -ErrorAction SilentlyContinue |
                Select-Object Id, StartTime, Path | Format-Table -AutoSize | Out-String | Write-Host
              if (Test-Path $LogFile) {
                Write-Host "---- $LogFile (tail 100) ----"
                Get-Content $LogFile -Tail 100 | Write-Host
                Write-Host '---- end log ----'
              }
              Write-ServiceDiagnostics -Label "[$Phase] TIMEOUT"
              throw "[$Phase] timed out after ${TimeoutSeconds}s"
            }
            Write-Host "[$Phase] exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) {
              if (Test-Path $LogFile) {
                Write-Host "---- $LogFile (tail 100) ----"
                Get-Content $LogFile -Tail 100 | Write-Host
                Write-Host '---- end log ----'
              }
              Write-ServiceDiagnostics -Label "[$Phase] failed"
              throw "[$Phase] failed with exit code $($p.ExitCode)"
            }
          }

          # Dumps everything needed to diagnose why PudimNetMonAgent is not
          # running after an install/upgrade: the exact ImagePath sc stored
          # (validates the Inno-side quoting), the service state/exit codes, any
          # live agent processes, and the Windows event log entries the SCM or a
          # crash would have written in the last 15 minutes.
          function Write-ServiceDiagnostics {
            param([string]$Label)
            Write-Host "---- service diagnostics: $Label ----"
            Write-Host '---- sc qc PudimNetMonAgent (ImagePath) ----'
            sc.exe qc PudimNetMonAgent 2>&1 | Out-String | Write-Host
            Write-Host '---- sc query PudimNetMonAgent (state) ----'
            sc.exe query PudimNetMonAgent 2>&1 | Out-String | Write-Host
            Write-Host '---- Get-Service ----'
            Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue |
              Select-Object Status, Name, DisplayName, StartType |
              Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '---- pudim-agent processes ----'
            Get-Process pudim-agent -ErrorAction SilentlyContinue |
              Select-Object Id, StartTime, Path |
              Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '---- recent events mentioning the agent (System + Application) ----'
            try {
              Get-WinEvent -FilterHashtable @{
                LogName = 'System', 'Application'
                StartTime = (Get-Date).AddMinutes(-15)
              } -MaxEvents 500 -ErrorAction Stop |
                Where-Object {
                  $_.Message -match 'PudimNetMonAgent|pudim-agent|PudimNetMon'
                } |
                Sort-Object TimeCreated -Descending |
                Select-Object -First 20 TimeCreated, LogName, ProviderName, Id, LevelDisplayName, Message |
                Format-List | Out-String -Width 300 | Write-Host
            } catch {
              Write-Host "  (event log unavailable: $($_.Exception.Message))"
            }
            Write-Host '---- end service diagnostics ----'
          }

          $setup = Get-ChildItem dist/installer/PudimNetMon-Agent-Setup-*.exe |
            Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced' }
          $installLog = Join-Path $env:TEMP 'pudim-setup-install.log'
          $upgradeLog = Join-Path $env:TEMP 'pudim-setup-upgrade.log'
          $uninstallLog = Join-Path $env:TEMP 'pudim-setup-uninstall.log'

          # ---- 0. Agent startup probe (diagnostics only): launch the freshly
          # built binary in the console for a few seconds and capture its stdout.
          # This shows whether the exe loads, initializes and runs on this exact
          # runner image BEFORE the Service Control Manager is involved, so a
          # later service-start failure can be attributed to service plumbing
          # rather than the binary itself. Bound and killed like every other
          # child below. Purely diagnostic: any probe failure must never fail
          # the step, so the whole block is guarded.
          try {
            $payloadAgent = Join-Path $PWD 'installer\payload\pudim-agent.exe'
            if (Test-Path $payloadAgent) {
              $probeOut = Join-Path $env:TEMP 'pudim-agent-probe.out'
              $probeErr = Join-Path $env:TEMP 'pudim-agent-probe.err'
              Write-Host '[probe] launching pudim-agent in console (15s bound)'
              $probe = Start-Process -FilePath $payloadAgent `
                -ArgumentList '--node-id=ci-console-probe' `
                -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr `
                -PassThru -WindowStyle Hidden
              if (-not $probe.WaitForExit(15000)) {
                Write-Host '[probe] still running after 15s (startup OK); stopping it'
                Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
                Start-Sleep -Milliseconds 500
              } else {
                Write-Host "[probe] exited on its own, code $($probe.ExitCode)"
              }
              Write-Host '---- probe stdout (agent startup log) ----'
              Get-Content $probeOut -ErrorAction SilentlyContinue |
                Select-Object -First 80 | Write-Host
              Write-Host '---- probe stderr ----'
              Get-Content $probeErr -ErrorAction SilentlyContinue |
                Select-Object -First 40 | Write-Host
            } else {
              Write-Host "[probe] payload agent not found at $payloadAgent; skipping"
            }
          } catch {
            Write-Host "[probe] diagnostics failed (non-fatal): $($_.Exception.Message)"
          } finally {
            # Never leave a probe agent running behind.
            Get-Process pudim-agent -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "  killing leftover probe pudim-agent pid=$($_.Id)"
                Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
              }
          }

          # ---- 1. Silent install -----------------------------------------------
          Invoke-SetupProcess -Phase 'install' -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$installLog" `
            -LogFile $installLog

          Start-Sleep -Seconds 3
          $svc = Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-ServiceDiagnostics -Label 'install: service missing'
            throw 'PudimNetMonAgent service not registered'
          }
          if ($svc.Status -notin 'Running', 'StartPending') {
            Write-ServiceDiagnostics -Label 'install: service not running'
            Write-Host '---- manual sc start attempt (captures the real error) ----'
            sc.exe start PudimNetMonAgent 2>&1 | Out-String | Write-Host
            Start-Sleep -Seconds 2
            sc.exe query PudimNetMonAgent 2>&1 | Out-String | Write-Host
            Get-Process pudim-agent -ErrorAction SilentlyContinue |
              Select-Object Id, StartTime, Path |
              Format-Table -AutoSize | Out-String | Write-Host
            if (Test-Path $installLog) {
              Write-Host "---- $installLog (tail 100) ----"
              Get-Content $installLog -Tail 100 | Write-Host
              Write-Host '---- end log ----'
            }
            throw "Service not running after install (status: $($svc.Status))"
          }
          Write-Host "[install] Service OK ($($svc.Status))"

          # ---- 2. Config model: only node-id is baked into the ImagePath; every
          # mutable setting lives in agent.conf (single source of truth). -------
          $binPath = ((sc.exe qc PudimNetMonAgent) |
            Select-String 'BINARY_PATH_NAME' | Select-Object -First 1).Line
          Write-Host $binPath
          if ($binPath -notmatch 'pudim-agent\.exe" --node-id=') {
            throw "Expected --node-id on the service command line, got: $binPath"
          }
          if ($binPath -match '--interval|--collector') {
            throw "Mutable settings must not be baked into the ImagePath: $binPath"
          }

          $confPath = Join-Path $env:ProgramData 'PudimNetMon\agent.conf'
          if (-not (Test-Path $confPath)) { throw "agent.conf not written: $confPath" }
          $conf = Get-Content $confPath -Raw
          Write-Host "agent.conf:`n$conf"
          if ($conf -notmatch 'interval=5000') {
            throw 'agent.conf missing the silent-install default interval=5000'
          }
          if ($conf -match 'node-id=') {
            throw 'agent.conf must not contain node-id (it lives on the service command line)'
          }

          # ---- 3. Upgrade path: re-run the installer over the existing install.
          # Exercises the service-exists -> ChangeServiceConfig branch and rewrites
          # agent.conf before the service is restarted. -------------------------
          Invoke-SetupProcess -Phase 'upgrade' -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$upgradeLog" `
            -LogFile $upgradeLog

          Start-Sleep -Seconds 3
          $svc = Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue
          if (-not $svc) {
            Write-ServiceDiagnostics -Label 'upgrade: service missing'
            throw 'PudimNetMonAgent service missing after upgrade'
          }
          if ($svc.Status -notin 'Running', 'StartPending') {
            Write-ServiceDiagnostics -Label 'upgrade: service not running'
            Write-Host '---- manual sc start attempt (captures the real error) ----'
            sc.exe start PudimNetMonAgent 2>&1 | Out-String | Write-Host
            Start-Sleep -Seconds 2
            sc.exe query PudimNetMonAgent 2>&1 | Out-String | Write-Host
            if (Test-Path $upgradeLog) {
              Write-Host "---- $upgradeLog (tail 100) ----"
              Get-Content $upgradeLog -Tail 100 | Write-Host
              Write-Host '---- end log ----'
            }
            throw "Service not running after upgrade (status: $($svc.Status))"
          }
          Write-Host '[upgrade] OK: service running after reinstall'

          # ---- 4. agent.conf is authoritative: change the interval, restart, and
          # confirm the agent still comes up (no stale ImagePath flag overrides
          # the file). ----------------------------------------------------------
          (Get-Content $confPath) -replace 'interval=\d+', 'interval=4321' |
            Set-Content $confPath
          Restart-Service PudimNetMonAgent
          Start-Sleep -Seconds 5
          $svc = Get-Service PudimNetMonAgent
          if ($svc.Status -ne 'Running') {
            Write-ServiceDiagnostics -Label 'agent.conf restart'
            throw "Service not running after agent.conf change + restart (status: $($svc.Status))"
          }
          Write-Host 'agent.conf change OK: service restarted and running'

          # ---- 5. Uninstaller --------------------------------------------------
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'PudimNetMon Agent' } |
            Select-Object -First 1
          if (-not $entry) { throw 'Uninstaller not registered in Add/Remove Programs' }
          if ($entry.UninstallString -match '^"([^"]+)"') {
            $uninstExe = $Matches[1]
          } else {
            $uninstExe = $entry.UninstallString
          }

          Invoke-SetupProcess -Phase 'uninstall' -FilePath $uninstExe `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$uninstallLog" `
            -LogFile $uninstallLog

          Start-Sleep -Seconds 3
          if (Get-Service PudimNetMonAgent -ErrorAction SilentlyContinue) {
            Write-ServiceDiagnostics -Label 'uninstall: service still registered'
            throw 'Service still registered after uninstall'
          }
          Write-Host '[uninstall] OK: service removed'
          Write-Host 'Smoke test PASSED'

      # Check latest: https://github.com/actions/upload-artifact/releases
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pudimnetmon-agent-windows-setup
          path: dist/installer/*
          if-no-files-found: error

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      # Check latest: https://github.com/actions/setup-node/releases
      # Check latest: https://nodejs.org/en/about/previous-releases
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build