name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-agent:
    name: C++ Agent (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev libpcap-dev libsystemd-dev libsqlite3-dev

      - name: Configure
        run: cmake -S agent -B build/agent -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/agent -j$(nproc)

      - name: Test (CTest)
        working-directory: build/agent
        run: ctest --output-on-failure

  cpp-collector:
    name: C++ Collector (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev \
            libssl-dev libcurl4-openssl-dev libpq-dev librdkafka-dev

      - name: Configure
        run: cmake -S collector -B build/collector -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/collector -j$(nproc)

      - name: Test (CTest)
        working-directory: build/collector
        run: ctest --output-on-failure

  cpp-agent-windows:
    name: C++ Agent (Windows build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (vcpkg)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'
          vcpkgGitCommitId: 'e90cc0982b7cfae62447f1f3bed1fbca0bc8f6be'
          vcpkgJsonGlob: 'agent/vcpkg.json'
          runVcpkgInstall: true

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          cmake -S agent -B build/agent-win `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build/agent-win --config Release -j

      - name: Test (CTest)
        shell: pwsh
        working-directory: build/agent-win
        run: ctest -C Release --output-on-failure

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build