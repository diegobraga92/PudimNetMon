openapi: 3.0.3
info:
  title: PudimNetMon Collector REST API
  version: 1.0.0
  description: |
    REST API exposed by the collector on its HTTP endpoint (default :8080).

    The dashboard talks to the collector through a reverse proxy that forwards
    `/api/*` paths unchanged, so every endpoint is also available with an
    `/api` prefix. The non-prefixed paths are kept for legacy tooling and
    Prometheus scraping.

    Two actions go through the collector to the agent's gRPC
    DiagnosticService. Agent reconfiguration (`POST /api/agents/config`) and
    reading the current config (`GET /api/agents/config`). Both require a
    diagnostic endpoint for the agent: either the one it advertised in its
    heartbeat, or one the collector derived from the heartbeat's source address
    when the agent left `--diagnostic-address` unset.
servers:
  - url: http://collector:8080
    description: In-stack (docker-compose) address
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Collector liveness + storage health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/health:
    get:
      summary: Collector health (dashboard /api namespace)
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /agents:
    get:
      summary: Registered agents (from heartbeats)
      responses:
        '200':
          description: Agent registry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agents'
  /api/agents:
    get:
      summary: Registered agents (dashboard /api namespace)
      responses:
        '200':
          description: Agent registry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agents'

  /agents/delete:
    post:
      summary: Forget a registered agent (e.g. after its service was uninstalled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
      responses:
        '200':
          description: Agent list after the removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsDeleteResult'
        '400':
          description: Missing or invalid agent_id
        '404':
          description: No agent with the given id

  /api/agents/delete:
    post:
      summary: Forget a registered agent (dashboard /api namespace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
      responses:
        '200':
          description: Agent list after the removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsDeleteResult'
        '400':
          description: Missing or invalid agent_id
        '404':
          description: No agent with the given id

  /metrics:
    get:
      summary: Prometheus scrape endpoint (text format)
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  /api/metrics:
    get:
      summary: Time-series metrics for the dashboard
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
          description: Filter by agent id
        - name: check_type
          in: query
          required: false
          schema: { type: string }
          description: Filter by check type (e.g. dns_resolution, tcp_connect)
        - name: window_seconds
          in: query
          required: false
          schema: { type: integer, default: 300 }
          description: Look-back window
      responses:
        '200':
          description: Metric points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricPoint'
        '503':
          description: Storage (TimescaleDB) not available

  /alerts:
    get:
      summary: Active (firing) alerts
      responses:
        '200':
          description: List of firing alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveAlert'
  /api/alerts:
    get:
      summary: Active alerts (dashboard /api namespace)
      responses:
        '200':
          description: List of firing alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveAlert'

  /alert-history:
    get:
      summary: Alert state-transition history
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
      responses:
        '200':
          description: Alert events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEvent'
  /api/alert-history:
    get:
      summary: Alert history (dashboard /api namespace)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
      responses:
        '200':
          description: Alert events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEvent'

  /alert-rules:
    get:
      summary: Loaded alert rules
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rules'
  /api/alert-rules:
    get:
      summary: Loaded alert rules (dashboard /api namespace)
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rules'
    post:
      summary: Create or replace one alert rule (upsert by id)
      description: |
        Managed by the dashboard Alerts page. Persists the updated rule set to
        the collector's rules file when one is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule:
                  $ref: '#/components/schemas/RuleInput'
      responses:
        '200':
          description: Rule set after the upsert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesMutationResult'
        '400':
          description: Invalid rule (missing id/metric, bad op, ...)
        '503':
          description: Alerting unavailable
  /diagnostic:
    post:
      summary: Trigger an on-demand diagnostic on an agent (traceroute/pcap)
      description: Forwarded to the agent's gRPC DiagnosticService.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: trace_target
          in: query
          required: false
          schema: { type: string }
        - name: pcap_duration_s
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: pcap_filter
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Diagnostic report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticResult'
        '404':
          description: Agent has no known diagnostic endpoint (none advertised, none derivable)
        '502':
          description: Agent unreachable
  /api/diagnostic:
    post:
      summary: On-demand diagnostic (dashboard /api namespace)
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: trace_target
          in: query
          required: false
          schema: { type: string }
        - name: pcap_duration_s
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: pcap_filter
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Diagnostic report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticResult'

  /api/alerts/ack:
    post:
      summary: Acknowledge a firing alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id, agent_id]
              properties:
                rule_id: { type: string }
                agent_id: { type: string }
                target: { type: string, description: 'empty = all targets' }
      responses:
        '200':
          description: Ack result + updated active alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveAlert'
        '400':
          description: Invalid body / missing fields
        '503':
          description: Alerting disabled

  /api/alert-rules/delete:
    post:
      summary: Delete an alert rule and its firing state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id]
              properties:
                rule_id: { type: string }
      responses:
        '200':
          description: Rule set after the deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesMutationResult'
        '400':
          description: No rule with the given id
        '503':
          description: Alerting unavailable

  /api/agents/config:
    get:
      summary: Read an agent's current probe configuration
      description: Forwarded to the agent's DiagnosticService.GetConfig.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current config summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
        '404':
          description: Agent has no known diagnostic endpoint (none advertised, none derivable)
    post:
      summary: Reconfigure an agent's probes at runtime
      description: |
        Forwarded to the agent's DiagnosticService.Reconfigure. The request is
        the complete new config. Empty arrays clear the corresponding target
        list. Applies on the next probe cycle, with no agent restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                dns_targets: { type: array, items: { type: string } }
                tcp_targets: { type: array, items: { type: string } }
                tls_targets: { type: array, items: { type: string } }
                http_targets: { type: array, items: { type: string } }
                ping_targets: { type: array, items: { type: string } }
                ping_count: { type: integer, default: 4 }
                tls_cert_check: { type: boolean, default: true }
                tcp_retransmit_check: { type: boolean, default: true }
                tcp_handshake_capture: { type: boolean, default: true }
                http_protocols:
                  type: array
                  items: { type: string }
                  description: http1.1, http2, http3
      responses:
        '200':
          description: Applied config summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
        '400':
          description: Invalid body / missing agent_id
        '404':
          description: Agent has no known diagnostic endpoint (none advertised, none derivable)
        '502':
          description: Agent unreachable

  /api/agents/commands:
    get:
      summary: List an agent's pre-set (whitelisted) command catalog
      description: |
        Forwarded to the agent's DiagnosticService.ListCommands. Commands are
        fixed, compiled handlers. The agent never executes arbitrary shell or
        terminal input.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Command catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCommandsResponse'
        '400':
          description: Missing agent_id
        '404':
          description: Agent has no known diagnostic endpoint (none advertised, none derivable)
        '502':
          description: Agent unreachable

  /api/agents/command:
    post:
      summary: Run a pre-set command on an agent
      description: |
        Forwarded to the agent's DiagnosticService.RunCommand. The command_id
        must be one of the ids returned by /api/agents/commands. Params are
        command-specific schema-fixed keys, never a shell command line.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, command_id]
              properties:
                agent_id: { type: string }
                command_id: { type: string, example: hdd_check }
                params:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Structured command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          description: Invalid body / missing agent_id or command_id
        '404':
          description: Agent has no known diagnostic endpoint (none advertised, none derivable)
        '502':
          description: Agent unreachable

  /api/command-schedules:
    get:
      summary: List scheduled ("heavy") commands
      description: |
        Schedules persisted by the collector. Each schedule runs one pre-set
        agent command repeatedly inside a time window at a fixed interval.
        Derived fields (active/expired/next_in_ms) are computed server-side.
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommandSchedule'
        '503':
          description: TimescaleDB storage unavailable
    post:
      summary: Create a command schedule
      description: |
        Example: run speedtest every 3600 seconds for the next 12 hours on
        agent-x. Requires interval_sec >= 60 and a future window_end_unix_ms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, command_id, window_end_unix_ms, interval_sec]
              properties:
                agent_id: { type: string }
                command_id: { type: string, example: speedtest }
                label: { type: string }
                params:
                  type: object
                  additionalProperties: { type: string }
                window_start_unix_ms: { type: integer, format: int64 }
                window_end_unix_ms: { type: integer, format: int64 }
                interval_sec: { type: integer, example: 3600 }
      responses:
        '200':
          description: Created schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }
                  schedule:
                    $ref: '#/components/schemas/CommandSchedule'
        '400':
          description: Invalid body or parameters
        '503':
          description: TimescaleDB storage unavailable

  /api/command-schedules/delete:
    post:
      summary: Delete a command schedule
      description: Removes the schedule definition but keeps its run history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        '200':
          description: Deleted
        '400':
          description: Missing id or unknown schedule
        '503':
          description: TimescaleDB storage unavailable

  /api/command-schedules/enable:
    post:
      summary: Pause or resume a command schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, enabled]
              properties:
                id: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated schedule
        '400':
          description: Missing id/enabled or unknown schedule
        '503':
          description: TimescaleDB storage unavailable

  /api/command-runs:
    get:
      summary: Recent command executions (scheduled and ad-hoc)
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
        - name: command_id
          in: query
          required: false
          schema: { type: string }
        - name: schedule_id
          in: query
          required: false
          description: Filter to runs of one schedule (for per-schedule trends)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Run history (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommandRun'
        '503':
          description: TimescaleDB storage unavailable

  /api/agent/versions:
    get:
      summary: Agent download manifest (self-hosted binaries)
      description: |
        Lists the pudim-agent binaries staged on this collector. Platforms
        without a staged binary are omitted from the list.
      responses:
        '200':
          description: Manifest of downloadable agent binaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  platforms:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: linux-amd64 }
                        os: { type: string, example: linux }
                        arch: { type: string, example: x86_64 }
                        filename: { type: string, example: pudim-agent-linux-amd64 }
                        size_bytes: { type: integer }
                        sha256: { type: string }
                        download_url:
                          type: string
                          example: /api/agent/download?platform=linux-amd64

  /api/agent/download:
    get:
      summary: Download a staged agent binary
      description: Serves the binary for a platform as application/octet-stream.
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string, example: linux-amd64 }
      responses:
        '200':
          description: Agent binary (application/octet-stream with Content-Disposition)
        '404':
          description: No binary staged for the requested platform
        '500':
          description: Staged binary could not be read

components:
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        component: { type: string }
        storage: { type: boolean }

    Agents:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    Agent:
      type: object
      properties:
        agent_id: { type: string }
        last_seen_unix_ms: { type: integer }
        interval_ms: { type: integer }
        version: { type: string }
        diagnostic_endpoint: { type: string }
        first_seen_unix_ms: { type: integer }
        alive: { type: boolean }

    AgentsDeleteResult:
      type: object
      properties:
        success: { type: boolean }
        error: { type: string }
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    MetricPoint:
      type: object
      properties:
        time_ms: { type: number }
        agent_id: { type: string }
        check_type: { type: string }
        target: { type: string }
        success: { type: boolean }
        value: { type: number }
        attributes:
          type: object
          additionalProperties: { type: string }

    ActiveAlert:
      type: object
      properties:
        rule_id: { type: string }
        rule_name: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        agent_id: { type: string }
        target: { type: string }
        value: { type: number }
        threshold: { type: number }
        acknowledged: { type: boolean }
        fired_ms: { type: integer }

    AlertEvent:
      type: object
      properties:
        rule_id: { type: string }
        rule_name: { type: string }
        agent_id: { type: string }
        check_type: { type: string }
        target: { type: string }
        severity: { type: string }
        status: { type: string, enum: [firing, resolved] }
        value: { type: number }
        threshold: { type: number }
        detail: { type: string }
        time_ms: { type: integer }

    Rules:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleInput'

    RuleInput:
      type: object
      required: [id]
      properties:
        id: { type: string, description: 'Unique slug. Upsert key.' }
        name: { type: string }
        agent_id:
          type: string
          description: 'Empty = all agents'
        check_type:
          type: string
          description: 'e.g. tcp_connect, icmp_ping; empty = all check types'
        target:
          type: string
          description: 'Empty = all targets'
        metric:
          type: string
          description: 'latency_ms, packet_loss_pct, jitter_ms, rtt_ms, status_code'
        op: { type: string, enum: ['>', '<'] }
        threshold: { type: number }
        repeat_interval_sec:
          type: integer
          description: 'Min seconds between repeat notifications (0 disables repeats)'
        severity: { type: string, enum: [info, warning, critical] }
        on_failure:
          type: boolean
          description: 'Fire when the probe itself fails instead of on a metric threshold'

    RulesMutationResult:
      type: object
      properties:
        success: { type: boolean }
        error: { type: string }
        persisted:
          type: boolean
          description: 'False when no rules file is configured (edits are in-memory only)'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleInput'

    DiagnosticResult:
      type: object
      properties:
        success: { type: boolean }
        timestamp_unix_ms: { type: integer }
        result: { type: string }

    AgentCommandsResponse:
      type: object
      properties:
        success: { type: boolean }
        error: { type: string }
        commands:
          type: array
          items:
            type: object
            properties:
              command_id: { type: string }
              description: { type: string }
              param_names:
                type: array
                items: { type: string }

    CommandResult:
      type: object
      properties:
        success: { type: boolean }
        command_id: { type: string }
        error: { type: string }
        timestamp_unix_ms: { type: integer }
        summary: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        issues:
          type: array
          items: { type: string }
        detail: { type: string }

    AgentConfigResponse:
      type: object
      properties:
        success: { type: boolean }
        applied:
          type: string
          description: Human-readable summary, e.g. "dns=example.com tcp= tls= http= ping=1.1.1.1 ping_count=4 tls_cert=on ..."
        error: { type: string }

    CommandSchedule:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        agent_id: { type: string }
        command_id: { type: string }
        params:
          type: object
          additionalProperties: { type: string }
        window_start_unix_ms: { type: integer }
        window_end_unix_ms: { type: integer }
        interval_sec: { type: integer }
        next_run_unix_ms: { type: integer }
        enabled: { type: boolean }
        active: { type: boolean }
        expired: { type: boolean }
        next_in_ms: { type: integer }

    CommandRun:
      type: object
      properties:
        run_id: { type: integer }
        schedule_id: { type: string }
        agent_id: { type: string }
        command_id: { type: string }
        scheduled_unix_ms: { type: integer }
        started_unix_ms: { type: integer }
        finished_unix_ms: { type: integer }
        running: { type: boolean }
        success: { type: boolean }
        error: { type: string }
        summary: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        issues:
          type: array
          items: { type: string }
        detail: { type: string }

