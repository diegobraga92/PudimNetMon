<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- PudimNetMon: a flan (pudim) as the network hub, with caramel-drop agents. -->
    <clipPath id="hub">
      <circle cx="16" cy="16" r="6"/>
    </clipPath>
    <radialGradient id="custard" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#faf0c8"/>
      <stop offset="100%" stop-color="#ecd492"/>
    </radialGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d06a2c"/>
      <stop offset="100%" stop-color="#a84417"/>
    </linearGradient>
    <radialGradient id="drop" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#de7a34"/>
      <stop offset="100%" stop-color="#9c3f15"/>
    </radialGradient>
  </defs>
  <!-- No background tile: the icon sits on a transparent background. -->

  <!-- Network links between the pudim hub and the caramel-drop agents. -->
  <g stroke="#c08f63" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M9 10.9 L14 14"/>
    <path d="M23 10.9 L18 14"/>
    <path d="M9 21.1 L14 18"/>
    <path d="M23 21.1 L18 18"/>
  </g>

  <!-- Pudim hub: cream custard disc with caramel coating and drip scallops. -->
  <g>
    <circle cx="16" cy="16" r="6" fill="url(#custard)"/>
    <g clip-path="url(#hub)">
      <path fill="url(#caramel)"
        d="M7 8 H25 V15.9
           Q23.9 16.2 23.2 16.8 Q22.3 15.6 21.4 16.2 Q20.6 17.4 19.6 16.4
           Q18.7 15.7 17.8 16.2 Q16.9 17.4 15.9 16.4 Q15.1 15.7 14.2 16.2
           Q13.3 17.3 12.4 16.4 Q11.5 15.8 10.6 16.2 Q9.6 16.5 8.6 15.8 Z"/>
      <!-- glossy sheen on the caramel coating -->
      <ellipse cx="15.2" cy="12.4" rx="2.3" ry="1.1" fill="#f7e3b6" opacity="0.45"/>
    </g>
  </g>

  <!-- Caramel-drop agents at the four corners. -->
  <g>
    <circle cx="6" cy="9" r="3.5" fill="url(#drop)"/>
    <circle cx="26" cy="9" r="3.5" fill="url(#drop)"/>
    <circle cx="6" cy="23" r="3.5" fill="url(#drop)"/>
    <circle cx="26" cy="23" r="3.5" fill="url(#drop)"/>
    <g fill="#ffe6c2" opacity="0.85">
      <circle cx="4.9" cy="7.9" r="0.9"/>
      <circle cx="24.9" cy="7.9" r="0.9"/>
      <circle cx="4.9" cy="21.9" r="0.9"/>
      <circle cx="24.9" cy="21.9" r="0.9"/>
    </g>
  </g>
</svg>
