services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pudimnetmon
      POSTGRES_USER: pudim
      POSTGRES_PASSWORD: pudim
    ports:
      - "${PUDIM_TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudim -d pudimnetmon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${PUDIM_KAFKA_PORT:-9092}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.collector
    ports:
      - "${PUDIM_COLLECTOR_GRPC_PORT:-50051}:50051"  # gRPC
      - "${PUDIM_COLLECTOR_HTTP_PORT:-8080}:8080"    # HTTP health/metrics
    environment:
      PUDIM_DB_HOST: timescaledb
      PUDIM_DB_PORT: "5432"
      PUDIM_DB_NAME: pudimnetmon
      PUDIM_DB_USER: pudim
      PUDIM_DB_PASSWORD: pudim
    command:
      - "--kafka-brokers=kafka:9092"  # Kafka mode: consumers own storage + alerting
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  consumer-storage:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.consumers
    ports:
      - "${PUDIM_CONSUMER_STORAGE_PROMETHEUS_PORT:-9091}:9091"  # Prometheus
    command:
      - "/usr/local/bin/pudim-consumer-storage"
      - "--kafka-brokers=kafka:9092"
      - "--db-host=timescaledb"
      - "--db-port=5432"
      - "--db-name=pudimnetmon"
      - "--db-user=pudim"
      - "--db-password=pudim"
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  consumer-alert:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.consumers
    ports:
      # Prometheus /metrics for the alert consumer. Default is 9093: the
      # original 9092 collided with Kafka's host port. Configure via
      # PUDIM_CONSUMER_ALERT_PROMETHEUS_PORT in .env if needed.
      - "${PUDIM_CONSUMER_ALERT_PROMETHEUS_PORT:-9093}:9092"  # Prometheus
    command:
      - "/usr/local/bin/pudim-consumer-alert"
      - "--kafka-brokers=kafka:9092"
      - "--alert-rules-path=/etc/pudim/alert_rules.json"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Phase 7 DR: secondary collector standing in for a second region. In a real
  # multi-region deployment each region runs its own collector + Kafka + DB;
  # here both collectors share the local stack so the failover drill is easy to
  # run (see docs/dr-test.md).
  collector-secondary:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.collector
    ports:
      - "${PUDIM_COLLECTOR_SECONDARY_GRPC_PORT:-50052}:50052"  # gRPC
      - "${PUDIM_COLLECTOR_SECONDARY_HTTP_PORT:-8081}:8081"    # HTTP health/metrics
    command:
      - "--grpc-addr=0.0.0.0:50052"
      - "--http-addr=0.0.0.0:8081"
      - "--kafka-brokers=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
    command: >
      --collector-endpoints=collector:50051,collector-secondary:50052
      --node-id=agent-docker-001
      --interval=10000
      --dns-targets=example.com
      --tcp-targets=example.com:443
      --tls-targets=example.com:443
      --http-targets=https://example.com
      --http-protocols=http1.1,http2
      --ping-targets=1.1.1.1
      --ping-count=4
      --diagnostic-address=agent:50052
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - collector
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "${PUDIM_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${PUDIM_GRAFANA_PORT:-3100}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "pudim"
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - collector
      - consumer-storage
      - consumer-alert
    restart: unless-stopped

volumes:
  timescaledb-data:
  kafka-data:
