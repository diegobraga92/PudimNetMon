syntax = "proto3";

package pudimnetmon;

option go_package = "github.com/diegobraga92/PudimNetMon/api/proto";

// Diagnostic service: the collector triggers one-off deep diagnostics on an
// agent (traceroute, packet capture) and receives a human-readable report.
// It also supports runtime probe reconfiguration (Reconfigure) so the
// dashboard can add/edit checks without restarting the agent.
//
// Pre-set commands (ListCommands/RunCommand): the dashboard can ask an agent
// to run a maintenance task (e.g. a disk health check) selected by id from a
// FIXED, whitelisted catalog. The agent never executes arbitrary shell /
// terminal input — each command_id maps to a compiled, vetted handler.
service DiagnosticService {
  rpc RunDiagnostic(DiagnosticRequest) returns (DiagnosticResponse);
  rpc Reconfigure(AgentConfigRequest) returns (AgentConfigResponse);
  rpc GetConfig(GetConfigRequest) returns (AgentConfigResponse);

  // Pre-set command execution.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc RunCommand(RunCommandRequest) returns (CommandResponse);
}

message DiagnosticRequest {
  string agent_id = 1;        // target agent
  string trace_target = 2;    // hostname/IP for traceroute (empty = skip)
  int32 pcap_duration_s = 3;  // seconds of packet capture (0 = skip pcap)
  string pcap_filter = 4;     // pcap filter expression, e.g. "tcp port 443"
}

message DiagnosticResponse {
  bool success = 1;              // overall success
  string result = 2;             // human-readable report (traceroute output, pcap summary)
  int64 timestamp_unix_ms = 3;   // agent wall clock when the run completed
  string error = 4;              // error message when success=false
}

// Runtime probe configuration. Reconfigure applies the request as
// the COMPLETE new config: empty repeated fields clear the corresponding
// target list, absent bools default to their proto defaults (true).
message AgentConfigRequest {
  string agent_id = 1;
  repeated string dns_targets = 2;
  repeated string tcp_targets = 3;
  repeated string tls_targets = 4;
  repeated string http_targets = 5;
  repeated string ping_targets = 6;
  int32 ping_count = 7;              // 0 resets to default (4)
  optional bool tls_cert_check = 8;           // default true
  optional bool tcp_retransmit_check = 9;     // default true
  optional bool tcp_handshake_capture = 10;   // default true
  repeated string http_protocols = 11;  // e.g. "http1.1","http2","http3"
}

message GetConfigRequest {
  string agent_id = 1;
}

// Carries the current config; `applied` holds the same string summary used by
// Reconfigure so the dashboard can display/parse it.
message AgentConfigResponse {
  bool success = 1;
  string error = 2;             // when success=false
  string applied = 3;           // human-readable summary of the applied config
}

// Request to run one of the agent's pre-set, whitelisted commands. The command
// is selected by command_id from the catalog exposed by ListCommands; `params`
// holds only command-specific, schema-fixed keys — never a shell command line.
message RunCommandRequest {
  string agent_id = 1;
  string command_id = 2;                 // catalog id, e.g. "hdd_check"
  map<string, string> params = 3;        // command-specific parameters
}

// Structured result of a pre-set command run. `fields` is machine-readable
// key/value output for the dashboard to render; `issues` lists any problems
// found (empty = healthy); `detail` is the full human-readable output.
message CommandResponse {
  bool success = 1;
  string command_id = 2;
  string error = 3;                      // when success=false
  int64 timestamp_unix_ms = 4;
  string summary = 5;                    // one-line human-readable result
  map<string, string> fields = 6;        // structured results
  repeated string issues = 7;            // problems found (empty = OK)
  string detail = 8;                     // full human-readable output
}

message ListCommandsRequest {
  string agent_id = 1;
}

// One entry of the agent's command catalog.
message CommandInfo {
  string command_id = 1;
  string description = 2;
  repeated string param_names = 3;       // optional parameter keys
}

message ListCommandsResponse {
  bool success = 1;
  string error = 2;                      // when success=false
  repeated CommandInfo commands = 3;
}